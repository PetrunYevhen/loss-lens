<header class="bar">
  <div class="bar__heading">
    <h1 class="bar__title">{{ title() }}</h1>
    <p class="bar__scope">{{ scope() }}</p>
  </div>

  <div class="bar__controls">
    <label class="field">
      {{ t.filters.date }}
      <input
        #date
        type="date"
        [value]="filters.date()"
        (change)="date.value && filters.update({ date: date.value })"
      />
    </label>

    @if (onlyLine(); as own) {
      <span class="field">
        {{ t.filters.line }}
        <span class="own-line">{{ own.name }}</span>
      </span>
    } @else {
      <label class="field">
        {{ t.filters.line }}
        <select #line (change)="filters.update({ lineId: line.value })">
          <option value="all" [selected]="filters.lineId() === 'all'">
            {{ t.filters.allLines }}
          </option>
          @for (item of lines(); track item.id) {
            <option [value]="item.id" [selected]="filters.lineId() === item.id">
              {{ item.name }}
            </option>
          }
        </select>
      </label>
    }

    <label class="field">
      {{ t.filters.shift }}
      <select #shift (change)="filters.update({ shiftId: shift.value })">
        <option value="all" [selected]="filters.shiftId() === 'all'">
          {{ t.filters.allShifts }}
        </option>
        @for (shift of shifts(); track shift.id) {
          <option [value]="shift.id" [selected]="filters.shiftId() === shift.id">
            {{ shift.name }} · {{ shift.start }}–{{ shift.end }}
          </option>
        }
      </select>
    </label>

    <label class="check">
      <input
        #auto
        type="checkbox"
        [checked]="filters.autoRefresh()"
        (change)="filters.update({ autoRefresh: auto.checked })"
      />
      {{ t.filters.autoRefresh }}
    </label>

    <span class="role-pill">
      <span class="role-pill__dot" aria-hidden="true"></span>
      {{ t.filters.role }}: {{ roleLabel() }}
    </span>
  </div>
</header>
