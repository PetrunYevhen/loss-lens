<section class="login card" aria-labelledby="login-title">
  <h1 id="login-title" class="login__title">{{ t.title }}</h1>
  <p class="login__text">{{ t.description }}</p>

  <form class="login__form" (submit)="submit($event, user.value, password.value)">
    <label class="field">
      {{ t.username }}
      <input #user id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required />
    </label>

    <label class="field">
      {{ t.password }}
      <input #password id="password" name="password" type="password" autocomplete="current-password" required />
    </label>

    @if (error(); as message) {
      <p class="login__error" role="alert">{{ message }}</p>
    }

    <button type="submit" class="btn btn--primary" [disabled]="busy()">
      {{ busy() ? t.submitting : t.submit }}
    </button>
  </form>
</section>
