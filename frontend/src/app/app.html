<div class="shell">
  <nav class="nav" [attr.aria-label]="t.nav.label">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#14161a" stroke-width="2.4" />
        <path d="M18.5 18.5L25 25" stroke="#14161a" stroke-width="2.6" stroke-linecap="round" />
        <path
          d="M7.5 14.5l3-3 2.5 2 3.5-4.5"
          fill="none"
          stroke="#eb6834"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span class="brand__name">{{ t.appName }}</span>
    </div>

    <ul class="nav__list">
      @for (item of items; track item.path) {
        <li>
          <a
            class="nav__link"
            [routerLink]="item.path"
            routerLinkActive="nav__link--active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            ariaCurrentWhenActive="page"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path [attr.d]="item.icon" />
            </svg>
            {{ item.label }}
          </a>
        </li>
      }
      <li class="nav__divider" role="separator"></li>
      <li>
        <a
          class="nav__link"
          [routerLink]="roleItem.path"
          routerLinkActive="nav__link--active"
          ariaCurrentWhenActive="page"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path [attr.d]="roleItem.icon" />
          </svg>
          {{ roleItem.label }}
        </a>
      </li>
    </ul>

    <div class="demo-note">
      <strong>{{ t.demoNote.title }}</strong>
      <span>{{ t.demoNote.text }}</span>
    </div>
  </nav>

  <main class="main">
    <router-outlet />
  </main>
</div>
